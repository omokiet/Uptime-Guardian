<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uptime Guardian — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: rgba(18, 24, 38, 0.85);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-focus: #3B82F6;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --color-green: #10B981;
      --color-red: #EF4444;
      --color-amber: #F59E0B;
      --color-blue: #3B82F6;
      --color-gray: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border-card); }
    .logo-badge { display: flex; align-items: center; gap: 12px; }
    .pulse-dot { width: 12px; height: 12px; background: var(--color-green); border-radius: 50%; box-shadow: 0 0 10px var(--color-green); }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .user-panel { display: flex; align-items: center; gap: 16px; }
    button { cursor: pointer; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: all 0.2s; border: none; }
    .btn-primary { background: var(--color-blue); color: #fff; }
    .btn-primary:hover { background: #2563EB; }
    .btn-outline { background: transparent; border: 1px solid var(--border-card); color: var(--text-main); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; }
    .stat-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
    .stat-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .monitors-section { margin-top: 24px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .grid-monitors { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; transition: border-color 0.2s; position: relative; }
    .card:hover { border-color: rgba(255, 255, 255, 0.2); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .monitor-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .monitor-url { font-size: 13px; color: var(--text-muted); word-break: break-all; font-family: 'JetBrains Mono', monospace; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-UP { background: rgba(16, 185, 129, 0.15); color: var(--color-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-DOWN { background: rgba(239, 68, 68, 0.15); color: var(--color-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-PENDING_DOWN { background: rgba(245, 158, 11, 0.15); color: var(--color-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-UNKNOWN { background: rgba(107, 114, 128, 0.15); color: var(--color-gray); border: 1px solid rgba(107, 114, 128, 0.3); }
    .card-body { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
    .card-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .card-actions button { padding: 4px 10px; font-size: 12px; }
    .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--color-red); border: 1px solid rgba(239, 68, 68, 0.2); }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.2); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: #182030; border: 1px solid var(--border-card); border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    input, select { width: 100%; background: #0F1422; border: 1px solid var(--border-card); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: var(--border-focus); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .empty-state { text-align: center; padding: 48px 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge">
        <div class="pulse-dot"></div>
        <h1>Uptime Guardian</h1>
      </div>
      <div class="user-panel">
        <span id="userEmail" style="font-size: 13px; color: var(--text-muted);">Khách</span>
        <button id="authBtn" class="btn-outline" onclick="openAuthModal()">Đăng nhập</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">TỔNG MONITORS</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">HOẠT ĐỘNG BÌNH THƯỜNG (UP)</div>
        <div class="stat-value" style="color: var(--color-green);" id="statUp">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">SỰ CỐ DOWNTIME (DOWN)</div>
        <div class="stat-value" style="color: var(--color-red);" id="statDown">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">ĐANG KIỂM TRA LẠI (PENDING)</div>
        <div class="stat-value" style="color: var(--color-amber);" id="statPending">0</div>
      </div>
    </div>

    <div class="monitors-section">
      <div class="section-header">
        <h2>Danh sách giám sát</h2>
        <button class="btn-primary" onclick="openAddModal()">+ Thêm Website</button>
      </div>
      <div id="monitorsGrid" class="grid-monitors">
        <div class="empty-state">Đang tải dữ liệu giám sát...</div>
      </div>
    </div>
  </div>

  <div id="addModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Thêm Monitor Mới</h3>
        <button class="btn-outline" onclick="closeAddModal()">✕</button>
      </div>
      <form id="addMonitorForm" onsubmit="handleAddMonitor(event)">
        <div class="form-group">
          <label>Tên định danh</label>
          <input type="text" id="mName" required placeholder="Ví dụ: Google Search">
        </div>
        <div class="form-group">
          <label>URL mục tiêu (Anti-SSRF enforced)</label>
          <input type="url" id="mUrl" required placeholder="https://example.com">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label>Chu kỳ (giây)</label>
            <select id="mInterval">
              <option value="30">30 giây</option>
              <option value="60" selected>60 giây</option>
              <option value="300">5 phút</option>
            </select>
          </div>
          <div class="form-group">
            <label>Timeout (giây)</label>
            <input type="number" id="mTimeout" value="10" min="1" max="60">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" onclick="closeAddModal()">Hủy</button>
          <button type="submit" class="btn-primary">Kích hoạt giám sát</button>
        </div>
      </form>
    </div>
  </div>

  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="authModalTitle">Đăng nhập tài khoản</h3>
        <button class="btn-outline" onclick="closeAuthModal()">✕</button>
      </div>
      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" required placeholder="dev@example.com">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="authPassword" required placeholder="Tối thiểu 6 ký tự">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="cursor: pointer; font-size: 13px;">
            <input type="checkbox" id="isRegisterCheck" style="width: auto; margin-right: 6px;"> Đăng ký tài khoản mới nếu chưa có
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" onclick="closeAuthModal()">Hủy</button>
          <button type="submit" class="btn-primary">Xác nhận</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin.includes(':8000') ? '' : 'http://localhost:8000';
    let token = localStorage.getItem('ug_token');

    function checkAuth() {
      if (token) {
        fetch(`${API_BASE}/api/v1/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(user => {
          document.getElementById('userEmail').innerText = user.email;
          document.getElementById('authBtn').innerText = 'Đăng xuất';
          document.getElementById('authBtn').onclick = logout;
          loadMonitors();
        })
        .catch(() => logout());
      } else {
        openAuthModal();
      }
    }

    function logout() {
      localStorage.removeItem('ug_token');
      token = null;
      document.getElementById('userEmail').innerText = 'Khách';
      document.getElementById('authBtn').innerText = 'Đăng nhập';
      document.getElementById('authBtn').onclick = openAuthModal;
      document.getElementById('monitorsGrid').innerHTML = '<div class="empty-state">Vui lòng đăng nhập để xem danh sách giám sát.</div>';
    }

    async function loadMonitors() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/api/v1/monitors`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error();
        const monitors = await res.json();
        renderMonitors(monitors);
      } catch (err) {
        document.getElementById('monitorsGrid').innerHTML = '<div class="empty-state">Không thể tải danh sách monitors.</div>';
      }
    }

    function renderMonitors(monitors) {
      let up = 0, down = 0, pending = 0;
      monitors.forEach(m => {
        if (m.current_status === 'UP') up++;
        else if (m.current_status === 'DOWN') down++;
        else if (m.current_status === 'PENDING_DOWN') pending++;
      });
      document.getElementById('statTotal').innerText = monitors.length;
      document.getElementById('statUp').innerText = up;
      document.getElementById('statDown').innerText = down;
      document.getElementById('statPending').innerText = pending;

      const grid = document.getElementById('monitorsGrid');
      if (monitors.length === 0) {
        grid.innerHTML = '<div class="empty-state">Chưa có monitor nào. Bấm nút "+ Thêm Website" để bắt đầu.</div>';
        return;
      }

      grid.innerHTML = monitors.map(m => `
        <div class="card">
          <div class="card-head">
            <div>
              <div class="monitor-name">${m.name}</div>
              <div class="monitor-url">${m.url}</div>
            </div>
            <span class="badge badge-${m.current_status}">${m.current_status}</span>
          </div>
          <div class="card-body">
            <span>Chu kỳ: ${m.interval_seconds}s</span>
            <span>Timeout: ${m.timeout_seconds}s</span>
            <span>Ngưỡng: ${m.consecutive_threshold} lần</span>
          </div>
          <div class="card-actions">
            <button class="btn-delete" onclick="deleteMonitor('${m.id}')">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    async function handleAddMonitor(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('mName').value,
        url: document.getElementById('mUrl').value,
        interval_seconds: parseInt(document.getElementById('mInterval').value),
        timeout_seconds: parseInt(document.getElementById('mTimeout').value),
        expected_status_code: 200,
        consecutive_threshold: 3,
        is_active: true
      };

      const res = await fetch(`${API_BASE}/api/v1/monitors`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeAddModal();
        loadMonitors();
      } else {
        const err = await res.json();
        alert('Lỗi: ' + (err.detail || 'Không thể tạo monitor'));
      }
    }

    async function deleteMonitor(id) {
      if (!confirm('Xác nhận xóa monitor này?')) return;
      const res = await fetch(`${API_BASE}/api/v1/monitors/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) loadMonitors();
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const isRegister = document.getElementById('isRegisterCheck').checked;

      if (isRegister) {
        const regRes = await fetch(`${API_BASE}/api/v1/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!regRes.ok) {
          const err = await regRes.json();
          alert('Đăng ký thất bại: ' + (err.detail || 'Lỗi'));
          return;
        }
      }

      const loginRes = await fetch(`${API_BASE}/api/v1/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (loginRes.ok) {
        const data = await loginRes.json();
        token = data.access_token;
        localStorage.setItem('ug_token', token);
        closeAuthModal();
        checkAuth();
      } else {
        alert('Đăng nhập thất bại. Kiểm tra lại email hoặc mật khẩu.');
      }
    }

    function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

    checkAuth();
    setInterval(() => { if (token) loadMonitors(); }, 10000);
  </script>
</body>
</html>
