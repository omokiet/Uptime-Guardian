name: CI — Continuous Integration

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend-validation:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: uptime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Code Style & Lint (Flake8)
        run: |
          flake8 services/ tests/ --count --max-line-length=120

      - name: Security SAST Audit (Bandit)
        run: |
          bandit -r services/ -ll -ii -x services/dashboard

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/uptime_test
        run: |
          alembic upgrade head

      - name: Run Test Suite (Pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/uptime_test
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/uptime_test
          REDIS_URL: redis://localhost:6379/0
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          SECRET_KEY: test-ci-secret-key-minimum-32-chars-long
          RUN_INTEGRATION_TESTS: "true"
        run: |
          pytest -v --cov=services

  frontend-validation:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard (Vite)
        run: npm run build

  docker-validation:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dev Compose
        run: docker compose -f docker/docker-compose.dev.yml config --quiet

      - name: Validate Prod Compose
        run: docker compose -f docker/docker-compose.prod.yml config --quiet
