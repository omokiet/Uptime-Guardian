name: CI — Continuous Integration

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend-validation:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Code Style & Lint (Flake8)
        run: |
          flake8 services/ tests/ --count --max-line-length=120

      - name: Security SAST Audit (Bandit)
        run: |
          bandit -r services/ -ll -ii -x services/dashboard

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v --cov=services

  frontend-validation:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: services/dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard (Vite)
        run: npm run build

  docker-validation:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dev Compose
        run: docker compose -f docker/docker-compose.dev.yml config --quiet

      - name: Validate Prod Compose
        run: docker compose -f docker/docker-compose.prod.yml config --quiet
